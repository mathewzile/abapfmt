name: build

# Builds abapfmt for every platform, runs the tests, and packages one VS Code extension (VSIX) that
# contains all builds. Run it manually (Actions > build > Run workflow) or push a tag like v1.0.0;
# a tag also publishes a GitHub release with the VSIX and an archive of the CLI per platform. The
# tag must match the version in Cargo.toml and package.json.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: build ${{ matrix.dir }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, dir: win32-x64, exe: abapfmt.exe, test: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, dir: linux-x64, exe: abapfmt, test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, dir: darwin-arm64, exe: abapfmt, test: true }
          # built on an Apple Silicon runner, so it is not run here
          - { os: macos-latest, target: x86_64-apple-darwin, dir: darwin-x64, exe: abapfmt, test: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Test
        if: matrix.test
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p abapfmt_cli --target ${{ matrix.target }}
      - name: Collect the binary
        run: |
          mkdir -p editors/vscode/bin/${{ matrix.dir }}
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} editors/vscode/bin/${{ matrix.dir }}/
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.dir }}
          path: editors/vscode/bin
          if-no-files-found: error

  package:
    name: package the extension
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: editors/vscode/bin
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Check the version
        working-directory: editors/vscode
        run: node scripts/check-version.mjs
      - name: Package
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package:all
      - uses: actions/upload-artifact@v7
        with:
          name: abapfmt-vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error

  release:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: abapfmt-vsix
          path: vsix
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          mkdir dist
          for dir in bins/*/; do
            platform=$(basename "$dir")
            if [ "$platform" = win32-x64 ]; then
              (cd "$dir" && zip -q "$GITHUB_WORKSPACE/dist/abapfmt-$version-$platform.zip" abapfmt.exe)
            else
              chmod +x "$dir/abapfmt"
              tar -czf "dist/abapfmt-$version-$platform.tar.gz" -C "$dir" abapfmt
            fi
          done
          cp vsix/*.vsix dist/
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes dist/*
